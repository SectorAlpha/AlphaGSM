# Disabled game server modules
#
# Each non-empty, non-comment line disables a game module.
# Format:  module_name	reason
# (tab-separated)
#
# When a user tries to create a server with a disabled module,
# the create command will refuse and print the reason.
#
# To re-enable a server, remove or comment out its line.

