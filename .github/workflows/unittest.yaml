    runs-on: ${{ fromJson(matrix.runner_class == 'heavy' && (vars.ALPHAGSM_HEAVY_RUNNER_LABELS_JSON || '["ubuntu-latest"]') || '["ubuntu-latest"]') }}
    needs: [collect-integration-rechecks, build-integration-image, build-java-runtime, build-simple-tcp-runtime, build-steamcmd-linux-runtime, build-wine-proton-runtime]
