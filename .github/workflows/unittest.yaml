name: AlphaGSM PR

on:
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  ALPHAGSM_MINECRAFT_RELEASE_ID: "1.21.11"
  ALPHAGSM_MINECRAFT_SERVER_URL: "https://piston-data.mojang.com/v1/objects/64bb6d763bed0a9f1d632ec347938594144943ed/server.jar"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AlphaGSM code
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  lint:
    runs-on: ubuntu-latest
    needs: build
    env:
      PYTHONPATH: .:src
    steps:
      - name: Checkout AlphaGSM code
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: AlphaGSM Lint
        run: |
          bash ./lint.sh

  unit-test:
    runs-on: ubuntu-latest
    needs: build
    env:
      PYTHONPATH: .:src
    steps:
      - name: Checkout AlphaGSM code
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check canonical module parity report
        run: |
          python3 scripts/generate_module_parity_report.py --check
      - name: Check canonical game server support tracker
        run: |
          python3 scripts/generate_game_server_support_tracker.py --check
      - name: AlphaGSM Unit Tests
        run: pytest tests/unit_tests -n auto

  coverage:
    runs-on: ubuntu-latest
    needs: build
    env:
      PYTHONPATH: .:src
    steps:
      - name: Checkout AlphaGSM code
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: AlphaGSM Coverage Report
        run: |
          pytest tests/unit_tests \
            --cov=core \
            --cov=downloader \
            --cov=downloadermodules \
            --cov=gamemodules \
            --cov=screen \
            --cov=server \
            --cov=utils \
            --cov-report=xml \
            -q --tb=no

  binary-build-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: alphagsm-linux
            binary: dist-binary/alphagsm
          - os: windows-latest
            artifact: alphagsm-windows
            binary: dist-binary/alphagsm.exe
          - os: macos-latest
            artifact: alphagsm-macos
            binary: dist-binary/alphagsm
    runs-on: ${{ matrix.os }}
    needs: build
    name: binary-build-smoke (${{ matrix.os }})
    steps:
      - name: Checkout AlphaGSM code
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build standalone AlphaGSM binary
        env:
          ALPHAGSM_VERSION: ci-${{ github.sha }}
        run: >-
          python scripts/build_binary.py
          --version ci-${{ github.sha }}
          --release-dir release-artifacts
          --artifact-name ${{ matrix.artifact }}-${{ runner.arch }}
      - name: Run binary smoke check
        env:
          ALPHAGSM_CONFIG_LOCATION: ${{ github.workspace }}/tests/alphagsm-test.conf
        run: release-artifacts/${{ matrix.artifact }}-${{ runner.arch }}${{ endsWith(matrix.binary, '.exe') && '.exe' || '' }} --version
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ runner.arch }}
          path: release-artifacts/*

  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      game_test_mode: ${{ steps.classify.outputs.game_test_mode }}
      has_smoke_standard_tests: ${{ steps.classify.outputs.has_smoke_standard_tests }}
      has_smoke_heavy_tests: ${{ steps.classify.outputs.has_smoke_heavy_tests }}
      has_integration_standard_tests: ${{ steps.classify.outputs.has_integration_standard_tests }}
      has_integration_heavy_tests: ${{ steps.classify.outputs.has_integration_heavy_tests }}
      smoke_standard_matrix: ${{ steps.classify.outputs.smoke_standard_matrix }}
      smoke_heavy_matrix: ${{ steps.classify.outputs.smoke_heavy_matrix }}
      integration_standard_matrix: ${{ steps.classify.outputs.integration_standard_matrix }}
      integration_heavy_matrix: ${{ steps.classify.outputs.integration_heavy_matrix }}
    steps:
      - name: Checkout AlphaGSM code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch PR base commit
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
      - id: classify
        name: Classify Linux game smoke and integration scope
        run: |
          python3 scripts/ci_game_test_routing.py \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}"

  discover-smoke-tests:
    runs-on: ubuntu-latest
    needs: [unit-test, lint, coverage, classify-changes]
    outputs:
      standard_matrix: ${{ steps.forward.outputs.standard_matrix }}
      heavy_matrix: ${{ steps.forward.outputs.heavy_matrix }}
      has_standard_tests: ${{ steps.forward.outputs.has_standard_tests }}
      has_heavy_tests: ${{ steps.forward.outputs.has_heavy_tests }}
    steps:
      - id: forward
        name: Forward Linux game smoke matrix
        run: |
          echo "Linux game smoke mode: ${{ needs.classify-changes.outputs.game_test_mode }}"
          echo "Standard smoke tests selected: ${{ needs.classify-changes.outputs.has_smoke_standard_tests }}"
          echo "Heavy smoke tests selected: ${{ needs.classify-changes.outputs.has_smoke_heavy_tests }}"
          echo 'standard_matrix=${{ needs.classify-changes.outputs.smoke_standard_matrix }}' >> "$GITHUB_OUTPUT"
          echo 'heavy_matrix=${{ needs.classify-changes.outputs.smoke_heavy_matrix }}' >> "$GITHUB_OUTPUT"
          echo 'has_standard_tests=${{ needs.classify-changes.outputs.has_smoke_standard_tests }}' >> "$GITHUB_OUTPUT"
          echo 'has_heavy_tests=${{ needs.classify-changes.outputs.has_smoke_heavy_tests }}' >> "$GITHUB_OUTPUT"

  smoke-test-standard:
    runs-on: ubuntu-latest
    if: needs.discover-smoke-tests.outputs.has_standard_tests == 'true'
    needs: [discover-smoke-tests, build-simple-tcp-runtime, build-steamcmd-linux-runtime, build-wine-proton-runtime]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-smoke-tests.outputs.standard_matrix) }}
    env:
      ALPHAGSM_BACKEND_DOCKER_IMAGE_SIMPLE_TCP: ${{ needs.build-simple-tcp-runtime.outputs.image }}
      ALPHAGSM_BACKEND_DOCKER_IMAGE_STEAMCMD_LINUX: ${{ needs.build-steamcmd-linux-runtime.outputs.image }}
      ALPHAGSM_BACKEND_DOCKER_IMAGE_WINE_PROTON: ${{ needs.build-wine-proton-runtime.outputs.image }}
      ALPHAGSM_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: .:src
    name: smoke-test (${{ matrix.label }})
    steps:
      - name: Checkout AlphaGSM code
        uses: actions/checkout@v4
      - name: Free runner disk space for large Docker smoke coverage
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/share/swift
          sudo docker system prune -af || true
          df -h /
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install system dependencies
        run: |
          for apt_source in /etc/apt/sources.list.d/*; do
            if sudo test -f "$apt_source" && sudo grep -qE 'packages\.microsoft\.com|azure-cli|microsoft-prod' "$apt_source"; then
              sudo rm -f "$apt_source"
            fi
          done
          sudo dpkg --add-architecture i386
          sudo apt-get update
          # screen   — required by all smoke tests (AlphaGSM uses GNU screen as
          #            the process supervisor; smoke runners call require_cmd screen)
          # lib32*   — 32-bit Steam runtime (Source engine servers: TF2, CS:GO, …)
          # p7zip    — server archives distributed as .7z
          sudo apt-get install -y screen lib32gcc-s1 lib32stdc++6 p7zip-full
      - name: Install .NET 10 runtime for SS14 smoke coverage
        if: contains(matrix.scripts, 'tests/smoke_tests/run_ss14server.sh')
        run: |
          wget -q https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb \
            -O /tmp/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          rm -f /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dotnet-runtime-10.0
      - name: Install Proton-GE for Sons Of The Forest smoke coverage
        if: contains(matrix.scripts, 'tests/smoke_tests/run_sonsoftheforestserver.sh')
        run: |
          bash scripts/install_proton.sh proton
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: AlphaGSM Smoke Tests
        run: |
          touch smoke-results.txt
          passed=0
          skipped=0
          failed=0
          for script in ${{ matrix.scripts }}; do
            echo ""
            echo "========================================"
            echo "Running: $script"
            echo "========================================"
            if bash "./$script"; then
              echo "PASSED: $script" | tee -a smoke-results.txt
              passed=$((passed + 1))
            else
              rc=$?
              if [ "$rc" -eq 77 ]; then
                echo "SKIPPED: $script" | tee -a smoke-results.txt
                skipped=$((skipped + 1))
              else
                echo "FAILED: $script" | tee -a smoke-results.txt
                failed=$((failed + 1))
              fi
            fi
          done
          if [ "$skipped" -gt 0 ]; then
            echo "$skipped smoke test(s) skipped"
          fi
          if [ "$failed" -gt 0 ]; then
            echo "$failed smoke test(s) failed"
            exit 1
          fi
      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ matrix.label }}
          path: smoke-results.txt

  smoke-test-heavy:
    runs-on: ${{ fromJson(vars.ALPHAGSM_HEAVY_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    if: needs.discover-smoke-tests.outputs.has_heavy_tests == 'true'
    needs: [discover-smoke-tests, build-simple-tcp-runtime, build-steamcmd-linux-runtime, build-wine-proton-runtime]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-smoke-tests.outputs.heavy_matrix) }}
    env:
      ALPHAGSM_BACKEND_DOCKER_IMAGE_SIMPLE_TCP: ${{ needs.build-simple-tcp-runtime.outputs.image }}
      ALPHAGSM_BACKEND_DOCKER_IMAGE_STEAMCMD_LINUX: ${{ needs.build-steamcmd-linux-runtime.outputs.image }}
      ALPHAGSM_BACKEND_DOCKER_IMAGE_WINE_PROTON: ${{ needs.build-wine-proton-runtime.outputs.image }}
      ALPHAGSM_ASTRONEER_REGISTRATION_PUBLICIP: ${{ vars.ALPHAGSM_ASTRONEER_REGISTRATION_PUBLICIP }}
      ALPHAGSM_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: .:src
    name: smoke-test (${{ matrix.label }})
    steps:
      - name: Checkout AlphaGSM code
        uses: actions/checkout@v4
      - name: Free runner disk space for large Docker smoke coverage
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/share/swift
          sudo docker system prune -af || true
          df -h /
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install system dependencies
        run: |
          for apt_source in /etc/apt/sources.list.d/*; do
            if sudo test -f "$apt_source" && sudo grep -qE 'packages\.microsoft\.com|azure-cli|microsoft-prod' "$apt_source"; then
              sudo rm -f "$apt_source"
            fi
          done
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y screen lib32gcc-s1 lib32stdc++6 p7zip-full
      - name: Install .NET 10 runtime for SS14 smoke coverage
        if: contains(matrix.scripts, 'tests/smoke_tests/run_ss14server.sh')
        run: |
          wget -q https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb \
            -O /tmp/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          rm -f /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dotnet-runtime-10.0
      - name: Install Proton-GE for Sons Of The Forest smoke coverage
        if: contains(matrix.scripts, 'tests/smoke_tests/run_sonsoftheforestserver.sh')
        run: |
          bash scripts/install_proton.sh proton
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: AlphaGSM Smoke Tests
        run: |
          touch smoke-results.txt
          passed=0
          skipped=0
          failed=0
          for script in ${{ matrix.scripts }}; do
            echo ""
            echo "========================================"
            echo "Running: $script"
            echo "========================================"
            if bash "./$script"; then
              echo "PASSED: $script" | tee -a smoke-results.txt
              passed=$((passed + 1))
            else
              rc=$?
              if [ "$rc" -eq 77 ]; then
                echo "SKIPPED: $script" | tee -a smoke-results.txt
                skipped=$((skipped + 1))
              else
                echo "FAILED: $script" | tee -a smoke-results.txt
                failed=$((failed + 1))
              fi
            fi
          done
          if [ "$skipped" -gt 0 ]; then
            echo "$skipped smoke test(s) skipped"
          fi
          if [ "$failed" -gt 0 ]; then
            echo "$failed smoke test(s) failed"
            exit 1
          fi
      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ matrix.label }}
          path: smoke-results.txt

  discover-integration-tests:
    runs-on: ubuntu-latest
    needs: [unit-test, lint, coverage, classify-changes]
    outputs:
      standard_matrix: ${{ steps.forward.outputs.standard_matrix }}
      heavy_matrix: ${{ steps.forward.outputs.heavy_matrix }}
      has_standard_tests: ${{ steps.forward.outputs.has_standard_tests }}
      has_heavy_tests: ${{ steps.forward.outputs.has_heavy_tests }}
    steps:
      - id: forward
        name: Forward Linux game integration matrix
        run: |
          echo "Linux game integration mode: ${{ needs.classify-changes.outputs.game_test_mode }}"
          echo "Standard integration tests selected: ${{ needs.classify-changes.outputs.has_integration_standard_tests }}"
          echo "Heavy integration tests selected: ${{ needs.classify-changes.outputs.has_integration_heavy_tests }}"
          echo 'standard_matrix=${{ needs.classify-changes.outputs.integration_standard_matrix }}' >> "$GITHUB_OUTPUT"
          echo 'heavy_matrix=${{ needs.classify-changes.outputs.integration_heavy_matrix }}' >> "$GITHUB_OUTPUT"
          echo 'has_standard_tests=${{ needs.classify-changes.outputs.has_integration_standard_tests }}' >> "$GITHUB_OUTPUT"
          echo 'has_heavy_tests=${{ needs.classify-changes.outputs.has_integration_heavy_tests }}' >> "$GITHUB_OUTPUT"

  build-integration-image:
    runs-on: ubuntu-latest
    needs: [unit-test, lint, coverage, build-wine-proton-runtime]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout AlphaGSM code
        uses: actions/checkout@v4

      - name: Compute image tags from content hash
        id: meta
        run: |
          wine_proton_image='${{ needs.build-wine-proton-runtime.outputs.image }}'
          hash=$(
            {
              printf '%s\n' "$wine_proton_image"
              cat .github/docker/integration-env/Dockerfile requirements.txt
            } | sha256sum | cut -c1-12
          )
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="ghcr.io/${owner}/alphagsm-integration-test"
          echo "image=${repo}:${hash}" >> "$GITHUB_OUTPUT"
          echo "latest=${repo}:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push integration test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/docker/integration-env/Dockerfile
          push: true
          build-args: |
            WINE_PROTON_IMAGE=${{ needs.build-wine-proton-runtime.outputs.image }}
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}

  build-steamcmd-linux-runtime:
    runs-on: ubuntu-latest
    needs: [unit-test, lint, coverage]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout AlphaGSM code
        uses: actions/checkout@v4

      - name: Compute steamcmd-linux runtime image tags from content hash
        id: meta
        run: |
          hash=$(sha256sum docker/steamcmd-linux/Dockerfile | cut -c1-12)
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="ghcr.io/${owner}/alphagsm-steamcmd-linux-runtime"
          echo "image=${repo}:${hash}" >> "$GITHUB_OUTPUT"
          echo "latest=${repo}:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push steamcmd-linux runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/steamcmd-linux/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}

  build-simple-tcp-runtime:
    runs-on: ubuntu-latest
    needs: [unit-test, lint, coverage]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout AlphaGSM code
        uses: actions/checkout@v4

      - name: Compute simple-tcp runtime image tags from content hash
        id: meta
        run: |
          hash=$(sha256sum docker/simple-tcp/Dockerfile | cut -c1-12)
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="ghcr.io/${owner}/alphagsm-simple-tcp-runtime"
          echo "image=${repo}:${hash}" >> "$GITHUB_OUTPUT"
          echo "latest=${repo}:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push simple-tcp runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/simple-tcp/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}

  build-java-runtime:
    runs-on: ubuntu-latest
    needs: [unit-test, lint, coverage]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout AlphaGSM code
        uses: actions/checkout@v4

      - name: Compute java runtime image tags from content hash
        id: meta
        run: |
          hash=$(
            sha256sum \
              docker/java/Dockerfile \
              docker/java/entrypoint.sh \
            | sha256sum | cut -c1-12
          )
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="ghcr.io/${owner}/alphagsm-java-runtime"
          echo "image=${repo}:${hash}" >> "$GITHUB_OUTPUT"
          echo "latest=${repo}:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push java runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/java/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}

  build-wine-proton-runtime:
    runs-on: ubuntu-latest
    needs: [unit-test, lint, coverage]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout AlphaGSM code
        uses: actions/checkout@v4

      - name: Compute wine-proton runtime image tags from content hash
        id: meta
        run: |
          hash=$(
            sha256sum \
              docker/wine-proton/Dockerfile \
              docker/wine-proton/entrypoint.sh \
              scripts/install_proton.sh \
              scripts/select_proton_asset.py \
            | sha256sum | cut -c1-12
          )
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="ghcr.io/${owner}/alphagsm-wine-proton-runtime"
          echo "image=${repo}:${hash}" >> "$GITHUB_OUTPUT"
          echo "latest=${repo}:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push wine-proton runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/wine-proton/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}

  integration-test-standard:
    runs-on: ubuntu-latest
    if: needs.discover-integration-tests.outputs.has_standard_tests == 'true'
    needs: [discover-integration-tests, build-integration-image, build-java-runtime, build-simple-tcp-runtime, build-steamcmd-linux-runtime, build-wine-proton-runtime]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-integration-tests.outputs.standard_matrix) }}
    container:
      image: ${{ needs.build-integration-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      ALPHAGSM_BACKEND_DOCKER_IMAGE_JAVA: ${{ needs.build-java-runtime.outputs.image }}
      ALPHAGSM_BACKEND_DOCKER_IMAGE_SIMPLE_TCP: ${{ needs.build-simple-tcp-runtime.outputs.image }}
      ALPHAGSM_BACKEND_DOCKER_IMAGE_STEAMCMD_LINUX: ${{ needs.build-steamcmd-linux-runtime.outputs.image }}
      ALPHAGSM_BACKEND_DOCKER_IMAGE_WINE_PROTON: ${{ needs.build-wine-proton-runtime.outputs.image }}
      ALPHAGSM_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: .:src
      WINEPREFIX: /opt/wine
    name: integration-test (${{ matrix.label }})
    steps:
      - name: Checkout AlphaGSM code
        uses: actions/checkout@v4
      - name: Free runner disk space for large Docker integration coverage
        run: |
          df -h /
          rm -rf /__t/*
          docker system prune -af || true
          df -h /
      - name: AlphaGSM Pytest Integration Tests
        continue-on-error: true
        env:
          ALPHAGSM_RUN_INTEGRATION: "1"
          ALPHAGSM_RUN_STEAMCMD: "1"
        run: |
          sock_gid="$(stat -c '%g' /var/run/docker.sock)"
          if ! getent group "$sock_gid" >/dev/null; then
            groupadd -g "$sock_gid" dockerhost
          fi
          usermod -aG "$sock_gid" gsmuser
          # Game servers that refuse to run as root (Insurgency: Sandstorm,
          # Mordhau, Squad, Palworld, Satisfactory, …) require a non-root uid.
          # Run the full pytest session as gsmuser (uid 1001) so every server
          # started by the tests inherits the non-root uid via screen.
          #
          # uid 1001 matches the GitHub Actions runner user that owns the
          # checked-out workspace, so no chown pass is needed.
          su - gsmuser -c "
            set -e
            cd '$GITHUB_WORKSPACE'
            export PYTHONPATH=.:src
            export ALPHAGSM_RUN_INTEGRATION=1
            export ALPHAGSM_RUN_STEAMCMD=1
            export GITHUB_ACTIONS='${GITHUB_ACTIONS}'
            export ALPHAGSM_GITHUB_TOKEN='${ALPHAGSM_GITHUB_TOKEN}'
            export ALPHAGSM_TEST_RUNTIME_BACKEND='${{ matrix.runtime_backend || 'auto' }}'
            export ALPHAGSM_WORK_DIR='${RUNNER_TEMP}/alphagsm-work'
            export ALPHAGSM_BACKEND_DOCKER_IMAGE_JAVA='${ALPHAGSM_BACKEND_DOCKER_IMAGE_JAVA}'
            export ALPHAGSM_BACKEND_DOCKER_IMAGE_SIMPLE_TCP='${ALPHAGSM_BACKEND_DOCKER_IMAGE_SIMPLE_TCP}'
            export ALPHAGSM_BACKEND_DOCKER_IMAGE_STEAMCMD_LINUX='${ALPHAGSM_BACKEND_DOCKER_IMAGE_STEAMCMD_LINUX}'
            export ALPHAGSM_BACKEND_DOCKER_IMAGE_WINE_PROTON='${ALPHAGSM_BACKEND_DOCKER_IMAGE_WINE_PROTON}'
            export WINEPREFIX=/opt/wine
            export WINEDEBUG=-all
            export WINEDLLOVERRIDES='winex11.drv='
            export SDL_VIDEODRIVER=offscreen
            export SDL_AUDIODRIVER=dummy
            export DISPLAY=
            python3 scripts/run_integration_batch_with_retry.py \
              --no-retry \
              --results-file results.xml \
              ${{ matrix.files }}
          "
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results-${{ matrix.label }}
          path: results.xml

