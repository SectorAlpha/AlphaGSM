  collect-integration-rechecks:
    runs-on: ubuntu-latest
    needs: [smoke-test-standard, smoke-test-heavy, integration-test-standard, integration-test-heavy, backend-integration-test]
    if: always()
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
      has_rechecks: ${{ steps.collect.outputs.has_rechecks }}
    steps:
      - name: Checkout AlphaGSM code
        uses: actions/checkout@v4
      - name: Download integration test results
        uses: actions/download-artifact@v4
        with:
          pattern: "integration-results-*"
          path: artifacts
          merge-multiple: false
      - name: Collect failed integration cases
        id: collect
        run: python3 scripts/collect_integration_rechecks.py artifacts --github-output "$GITHUB_OUTPUT"

  integration-flake-recheck:
    runs-on: ubuntu-latest
    needs: [collect-integration-rechecks, build-integration-image, build-java-runtime, build-simple-tcp-runtime, build-steamcmd-linux-runtime, build-wine-proton-runtime]
    if: always() && needs.collect-integration-rechecks.outputs.has_rechecks == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.collect-integration-rechecks.outputs.matrix) }}
    container:
      image: ${{ needs.build-integration-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      ALPHAGSM_BACKEND_DOCKER_IMAGE_JAVA: ${{ needs.build-java-runtime.outputs.image }}
      ALPHAGSM_BACKEND_DOCKER_IMAGE_SIMPLE_TCP: ${{ needs.build-simple-tcp-runtime.outputs.image }}
      ALPHAGSM_BACKEND_DOCKER_IMAGE_STEAMCMD_LINUX: ${{ needs.build-steamcmd-linux-runtime.outputs.image }}
      ALPHAGSM_BACKEND_DOCKER_IMAGE_WINE_PROTON: ${{ needs.build-wine-proton-runtime.outputs.image }}
      ALPHAGSM_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: .:src
      WINEPREFIX: /opt/wine
    name: "integration-flake-recheck (${{ matrix.runtime_backend }}: ${{ matrix.nodeid }})"
    steps:
      - name: Checkout AlphaGSM code
        uses: actions/checkout@v4
      - name: Free runner disk space for isolated integration recheck
        run: |
          df -h /
          rm -rf /__t/*
          docker system prune -af || true
          df -h /
      - name: Recheck failed integration case on a fresh runner
        env:
          ALPHAGSM_RUN_INTEGRATION: "1"
          ALPHAGSM_RUN_STEAMCMD: "1"
        run: |
          sock_gid="$(stat -c '%g' /var/run/docker.sock)"
          if ! getent group "$sock_gid" >/dev/null; then
            groupadd -g "$sock_gid" dockerhost
          fi
          usermod -aG "$sock_gid" gsmuser
          su - gsmuser -c "
            set -e
            cd '$GITHUB_WORKSPACE'
            export PYTHONPATH=.:src
            export ALPHAGSM_RUN_INTEGRATION=1
            export ALPHAGSM_RUN_STEAMCMD=1
            export GITHUB_ACTIONS='${GITHUB_ACTIONS}'
            export ALPHAGSM_GITHUB_TOKEN='${ALPHAGSM_GITHUB_TOKEN}'
            export ALPHAGSM_TEST_RUNTIME_BACKEND='${{ matrix.runtime_backend }}'
            export ALPHAGSM_WORK_DIR='${RUNNER_TEMP}/alphagsm-work'
            export ALPHAGSM_BACKEND_DOCKER_IMAGE_JAVA='${ALPHAGSM_BACKEND_DOCKER_IMAGE_JAVA}'
            export ALPHAGSM_BACKEND_DOCKER_IMAGE_SIMPLE_TCP='${ALPHAGSM_BACKEND_DOCKER_IMAGE_SIMPLE_TCP}'
            export ALPHAGSM_BACKEND_DOCKER_IMAGE_STEAMCMD_LINUX='${ALPHAGSM_BACKEND_DOCKER_IMAGE_STEAMCMD_LINUX}'
            export ALPHAGSM_BACKEND_DOCKER_IMAGE_WINE_PROTON='${ALPHAGSM_BACKEND_DOCKER_IMAGE_WINE_PROTON}'
            export WINEPREFIX=/opt/wine
            export WINEDEBUG=-all
            export WINEDLLOVERRIDES='winex11.drv='
            export SDL_VIDEODRIVER=offscreen
            export SDL_AUDIODRIVER=dummy
            export DISPLAY=
            python3 -m pytest -rs -o junit_logging=all \
              --junit-xml=recheck-results.xml \
              '${{ matrix.nodeid }}'
          "
      - name: Upload isolated recheck result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-recheck-results-${{ matrix.source_artifact }}-${{ strategy.job-index }}
          path: recheck-results.xml

  summarize-tests:
    runs-on: ubuntu-latest
    needs: [smoke-test-standard, smoke-test-heavy, integration-test-standard, integration-test-heavy, backend-integration-test, collect-integration-rechecks, integration-flake-recheck]
    if: always()
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: "*-results-*"
          path: artifacts
          merge-multiple: false
      - name: Summarize test results
        run: |
          python3 - <<'PYEOF'
          import glob, sys, xml.etree.ElementTree as ET
          from scripts.collect_integration_rechecks import partition_integration_failures

          smoke_passed, smoke_skipped, smoke_failed = [], [], []
          int_passed, int_skipped, int_failed = [], [], []
          recheck_passed, recheck_skipped, recheck_failed = [], [], []
          backend_passed, backend_skipped, backend_failed = [], [], []

          for txt in sorted(glob.glob("artifacts/smoke-results-*/*.txt")):
              for line in open(txt):
                  line = line.strip()
                  if line.startswith("PASSED: "):
                      smoke_passed.append(line[8:])
                  elif line.startswith("SKIPPED: "):
                      smoke_skipped.append(line[9:])
                  elif line.startswith("FAILED: "):
                      smoke_failed.append(line[8:])

          for xml_file in sorted(glob.glob("artifacts/integration-results-*/*.xml")):
              try:
                  root = ET.parse(xml_file).getroot()
              except ET.ParseError:
                  continue
              source_artifact = xml_file.parent.name
              for tc in root.iter("testcase"):
                  name = tc.attrib.get("classname", "") + "::" + tc.attrib.get("name", "")
                  skip = tc.find("skipped")
                  fail = tc.find("failure")
                  err = tc.find("error")
                  if skip is not None:
                      int_skipped.append((name, skip.attrib.get("message", "").split("\n")[0]))
                  elif fail is not None or err is not None:
                      node = fail if fail is not None else err
                      int_failed.append(
                          (source_artifact, name, node.attrib.get("message", "").split("\n")[0])
                      )
                  else:
                      int_passed.append(name)

          for xml_file in sorted(glob.glob("artifacts/integration-recheck-results-*/*.xml")):
              try:
                  root = ET.parse(xml_file).getroot()
              except ET.ParseError:
                  continue
              source = xml_file.parent.name.removeprefix("integration-recheck-results-")
              source_artifact = source.rsplit("-", 1)[0]
              for tc in root.iter("testcase"):
                  name = tc.attrib.get("classname", "") + "::" + tc.attrib.get("name", "")
                  skip = tc.find("skipped")
                  fail = tc.find("failure")
                  err = tc.find("error")
                  if skip is not None:
                      recheck_skipped.append(
                          (source_artifact, name, skip.attrib.get("message", "").split("\\n")[0])
                      )
                  elif fail is not None or err is not None:
                      node = fail if fail is not None else err
                      recheck_failed.append(
                          (source_artifact, name, node.attrib.get("message", "").split("\\n")[0])
                      )
                  else:
                      recheck_passed.append((source_artifact, name))

          recovered_int_failed, unrecovered_int_failed = partition_integration_failures(
              int_failed,
              set(recheck_passed),
          )

          for xml_file in sorted(glob.glob("artifacts/backend-integration-results-*/*.xml")):
              try:
                  root = ET.parse(xml_file).getroot()
              except ET.ParseError:
                  continue
              for tc in root.iter("testcase"):
                  name = tc.attrib.get("classname", "") + "::" + tc.attrib.get("name", "")
                  skip = tc.find("skipped")
                  fail = tc.find("failure")
                  err = tc.find("error")
                  if skip is not None:
                      backend_skipped.append((name, skip.attrib.get("message", "").split("\n")[0]))
                  elif fail is not None or err is not None:
                      node = fail if fail is not None else err
                      backend_failed.append((name, node.attrib.get("message", "").split("\n")[0]))
                  else:
                      backend_passed.append(name)

          SEP = "=" * 64
          print(SEP)
          print("AlphaGSM Test Summary")
          print(SEP)

          print("\nSMOKE TESTS")
          print(f"  Passed : {len(smoke_passed)}")
          print(f"  Skipped: {len(smoke_skipped)}")
          print(f"  Failed : {len(smoke_failed)}")
          if smoke_passed:
              print("\n  Passed:")
              for t in smoke_passed:
                  print(f"    PASS  {t}")
          if smoke_failed:
              print("\n  Failed:")
              for t in smoke_failed:
                  print(f"    FAIL  {t}")
          if smoke_skipped:
              print("\n  Skipped:")
              for t in smoke_skipped:
                  print(f"    SKIP  {t}")

          print("\nINTEGRATION TESTS")
          print(f"  Passed  : {len(int_passed)}")
          print(f"  Skipped : {len(int_skipped)}")
          print(f"  Failed  : {len(int_failed)}")
          if int_passed:
              print("\n  Passed (server launched successfully):")
              for t in int_passed:
                  print(f"    PASS  {t}")
          if int_skipped:
              print("\n  Skipped:")
              for t, r in int_skipped:
                  print(f"    SKIP  {t}")
                  if r:
                      print(f"          Reason: {r}")
          if int_failed:
              print("\n  Failed:")
              for source, t, r in int_failed:
                  print(f"    FAIL  {t} [{source}]")
                  if r:
                      print(f"          Reason: {r}")

          print("\nINTEGRATION FLAKE RECHECKS")
          print("  Recovered integration failures are temporarily non-blocking.")
          print(f"  Recovered : {len(recovered_int_failed)}")
          print(f"  Skipped   : {len(recheck_skipped)}")
          print(f"  Still red : {len(recheck_failed)}")
          if recovered_int_failed:
              print("\n  Recovered:")
              for source, t, _r in recovered_int_failed:
                  print(f"    FLAKY RECOVERED  {t} [{source}] (initial failure retained)")
          if recheck_skipped:
              print("\n  Skipped:")
              for source, t, r in recheck_skipped:
                  print(f"    RECHECK SKIP  {t} [{source}]")
                  if r:
                      print(f"                  Reason: {r}")
          if recheck_failed:
              print("\n  Still red:")
              for source, t, r in recheck_failed:
                  print(f"    RECHECK FAIL  {t} [{source}]")
                  if r:
                      print(f"                  Reason: {r}")

          print("\nBACKEND INTEGRATION TESTS")
          print(f"  Passed  : {len(backend_passed)}")
          print(f"  Skipped : {len(backend_skipped)}")
          print(f"  Failed  : {len(backend_failed)}")
          if backend_passed:
              print("\n  Passed:")
              for t in backend_passed:
                  print(f"    PASS  {t}")
          if backend_skipped:
              print("\n  Skipped:")
              for t, r in backend_skipped:
                  print(f"    SKIP  {t}")
                  if r:
                      print(f"          Reason: {r}")
          if backend_failed:
              print("\n  Failed:")
              for t, r in backend_failed:
                  print(f"    FAIL  {t}")
                  if r:
                      print(f"          Reason: {r}")

          total_p = len(smoke_passed) + len(int_passed) + len(backend_passed)
          total_s = len(smoke_skipped) + len(int_skipped) + len(backend_skipped)
          total_f = len(smoke_failed) + len(unrecovered_int_failed) + len(backend_failed)
          print("\n" + SEP)
          print(f"OVERALL  passed={total_p}  skipped={total_s}  failed={total_f}")
          print(SEP)

          if total_f > 0:
              sys.exit(1)
          PYEOF
