      ALPHAGSM_BACKEND_DOCKER_IMAGE_WINE_PROTON: ${{ needs.build-wine-proton-runtime.outputs.image }}
      PYTHONPATH: .:src
    name: backend-integration-test
    steps:
      - name: Checkout AlphaGSM code
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install tmux
        run: |
          for apt_source in /etc/apt/sources.list.d/*; do
            if sudo test -f "$apt_source" && sudo grep -qE 'packages\.microsoft\.com|azure-cli|microsoft-prod' "$apt_source"; then
              sudo rm -f "$apt_source"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y tmux
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Backend Integration Tests (screen, tmux, subprocess)
        env:
          ALPHAGSM_RUN_BACKEND_INTEGRATION: "1"
        run: |
          pytest \
            tests/backend_integration_tests/test_backend_port_manager.py \
            tests/backend_integration_tests/test_backend_screen.py \
            tests/backend_integration_tests/test_backend_tmux.py \
            tests/backend_integration_tests/test_backend_subprocess.py \
            tests/backend_integration_tests/test_backend_subprocess_integration.py \
            --junit-xml=backend-process-results.xml \
            -v
      - name: Backend Docker Integration Tests (active matrix cases)
        if: ${{ always() && !cancelled() }}
        env:
          ALPHAGSM_RUN_BACKEND_INTEGRATION: "1"
          ALPHAGSM_BACKEND_DOCKER_IMAGE_JAVA: ${{ needs.build-java-runtime.outputs.image }}
          ALPHAGSM_BACKEND_DOCKER_IMAGE_SIMPLE_TCP: ${{ needs.build-simple-tcp-runtime.outputs.image }}
          ALPHAGSM_BACKEND_DOCKER_IMAGE_STEAMCMD_LINUX: ${{ needs.build-steamcmd-linux-runtime.outputs.image }}
          ALPHAGSM_MANAGER_SERVER_IMAGE: ${{ needs.build-java-runtime.outputs.image }}
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          export ALPHAGSM_WRAPPER_DOCKER_IMAGE_JAVA="${{ needs.build-java-runtime.outputs.image }}"
          export ALPHAGSM_WRAPPER_DOCKER_IMAGE_QUAKE_LINUX="ghcr.io/${owner}/alphagsm-quake-linux-runtime:latest"
          export ALPHAGSM_WRAPPER_DOCKER_IMAGE_SERVICE_CONSOLE="ghcr.io/${owner}/alphagsm-service-console-runtime:latest"
          export ALPHAGSM_WRAPPER_DOCKER_IMAGE_SIMPLE_TCP="${{ needs.build-simple-tcp-runtime.outputs.image }}"
          export ALPHAGSM_WRAPPER_DOCKER_IMAGE_STEAMCMD_LINUX="${{ needs.build-steamcmd-linux-runtime.outputs.image }}"
          export ALPHAGSM_WRAPPER_DOCKER_IMAGE_WINE_PROTON="${{ needs.build-wine-proton-runtime.outputs.image }}"
          pytest \
            tests/backend_integration_tests/test_backend_docker.py \
            tests/backend_integration_tests/test_backend_docker_manager.py \
            tests/backend_integration_tests/test_alphagsm_docker_wrapper.py \
            --junit-xml=backend-docker-results.xml \
            -v
      - name: Upload backend integration test results
        if: always()
        uses: ./.github/actions/upload-test-artifact
        with:
          name: backend-integration-results-linux
          path: |
            backend-process-results.xml
            backend-docker-results.xml
      - name: Upload structured failure diagnostics
        if: always()
        uses: ./.github/actions/upload-test-artifact
        with:
          name: integration-diagnostics-backend
          path: diagnostics/*.json
          if-no-files-found: ignore

