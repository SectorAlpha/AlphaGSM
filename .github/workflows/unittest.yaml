  backend-smoke-test:
    runs-on: ubuntu-latest
    needs: [unit-test, lint, coverage, build-java-runtime]
    env:
      PYTHONPATH: .:src
      ALPHAGSM_BACKEND_DOCKER_IMAGE: ${{ needs.build-java-runtime.outputs.image }}
    name: backend-smoke-test
    steps:
      - name: Checkout AlphaGSM code
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install tmux
        run: |
          for apt_source in /etc/apt/sources.list.d/*; do
            if sudo test -f "$apt_source" && sudo grep -qE 'packages\.microsoft\.com|azure-cli|microsoft-prod' "$apt_source"; then
              sudo rm -f "$apt_source"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y tmux
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Backend Smoke Tests
        run: |
          failed=0
          for script in tests/smoke_tests/run_backend_*.sh; do
            echo ""
            echo "========================================"
            echo "Running: $script"
            echo "========================================"
            if ! bash "./$script"; then
              echo "FAILED: $script"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "$failed backend smoke test(s) failed"
            exit 1
          fi

  backend-integration-test:
    runs-on: ubuntu-latest
    needs: [unit-test, lint, coverage, build-integration-image, build-java-runtime, build-simple-tcp-runtime, build-steamcmd-linux-runtime, build-wine-proton-runtime]
    env:
      ALPHAGSM_DIAGNOSTICS_DIR: ${{ github.workspace }}/diagnostics
      ALPHAGSM_BACKEND_DOCKER_IMAGE_JAVA: ${{ needs.build-java-runtime.outputs.image }}
      ALPHAGSM_BACKEND_DOCKER_IMAGE_SIMPLE_TCP: ${{ needs.build-simple-tcp-runtime.outputs.image }}
