name: AlphaGSM Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version for a validated build (manual runs do not publish).
        required: true

permissions:
  contents: read
  packages: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        shell: bash
        run: |
          version="${REQUESTED_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release version must be MAJOR.MINOR.PATCH' >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
  validate:
    uses: ./.github/workflows/unittest.yaml
    secrets: inherit
    permissions:
      contents: read
      packages: write
  build:
    needs: [version, validate]
    uses: ./.github/workflows/binary.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.value }}
      release: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [version, validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Attest validated release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-artifacts/*
      - name: Publish complete validated release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          fail_on_unmatched_files: true
