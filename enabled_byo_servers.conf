# Enabled bring-your-own game server modules
#
# Each non-empty, non-comment line marks a game module as supported in
# ENABLED (BYO) mode.
#
# Format:  module_name	reason
# (tab-separated)
#
# These modules count as enabled/supported, but still require operator-supplied
# assets, config, authentication, or a direct download URL before setup/start
# can complete.
cod2server	copy owned Call of Duty 2 files into <install_dir>/main/: localized_*.iwd and default_localize_mp.cfg
cod4server	copy owned Call of Duty 4 files into <install_dir>/: fileSysCheck.cfg and main/localized_*.iwd
coduoserver	copy owned base Call of Duty multiplayer files into <install_dir>/main/: pak0.pk3 or default_mp.cfg
aloftserver	copy an owned Aloft server tree into <install_dir>/ so AloftServerNoGuiLoad.ps1 exists
ahlserver	copy the full Action Half-Life mod tree into <install_dir>/action/ so maps/ahl_hydro.bsp exists
bbserver	copy the full BrainBread mod tree into <install_dir>/brainbread/ so maps/bb_chp4_slaywatch.bsp exists
dstserver	provide cluster_token.txt plus cluster.ini and <shard>/server.ini under <install_dir>/<confdir>/<cluster>/
etlegacyserver	copy owned Wolfenstein: Enemy Territory base data into <install_dir>/etmain/: pak0.pk3
ets2server	stage exported ETS2 server packages/settings from an owned client install before start
gravserver	copy an owned GRAV dedicated server tree into <install_dir>/ so CAGGameServer-Win32-Shipping exists
gtafivemserver	provide a txAdmin/server-data setup with server.cfg and Cfx license key, or complete first-run txAdmin provisioning against the downloaded Linux artifact
hogwarpserver	set url to a direct HogWarp server archive or stage HogWarpServer.exe in <install_dir> before setup/start
identityserver	set url to a direct Identity server archive or stage IdentityServer.x86_64 in <install_dir> before setup/start
minecraft.custom	place a real server jar at <install_dir>/<exe_name> and rerun setup
mxbikesserver	set url to a real MX Bikes dedicated-server archive before setup
nsserver	copy the full Natural Selection mod tree into <install_dir>/ns/ so maps/ns_hera.bsp exists
pathoftitansserver	set auth_token to an Alderon host account token or stage a direct archive override before setup/start
q3server	copy owned Quake III Arena base data into <install_dir>/baseq3/: pak0.pk3
qlserver	use an owned/authenticated Quake Live entitlement plus any required server auth/config
redmserver	provide a txAdmin/server-data setup with server.cfg and Cfx license key, or complete first-run txAdmin provisioning against the downloaded Linux artifact
rtcwserver	copy owned RTCW multiplayer pk3 assets into <install_dir>/main/
mohaaserver	copy an owned MOHAA dedicated server tree into <install_dir>/ so mohaa_lnxded exists
sof2server	copy an owned SOF2 dedicated server tree into <install_dir>/ so sof2ded exists
stormworksserver	use authenticated Steam or SteamCMD access to install the Stormworks Dedicated Server tool, then stage that installed server tree into <install_dir>
subnauticaserver	provide a real Subnautica installation path for Nitrox (for example SUBNAUTICA_INSTALLATION_PATH)
tsserver	copy the full The Specialists mod tree into <install_dir>/ts/ so maps/ts_neobaroque.bsp exists
ut3server	copy an owned UT3 dedicated server tree into <install_dir>/ so Binaries/ut3 exists; set OpenSpy credentials if you want authenticated advertising
vsserver	copy the full Vampire Slayer mod tree into <install_dir>/vs/ so maps/vs_frost.bsp exists
lifeisfeudalserver	provide a local MySQL/MariaDB service reachable on localhost before start
