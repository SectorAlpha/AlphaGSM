# Enabled bring-your-own game server modules
#
# Each non-empty, non-comment line marks a game module as supported in
# ENABLED (BYO) mode.
#
# Format:  module_name	category	reason
# (tab-separated)
#
# These modules count as enabled/supported, but still require operator-supplied
# assets, config, authentication, or a direct download URL before setup/start
# can complete.
#
# Supported categories:
# - assets: owned files or installed content trees
# - auth: authenticated install access, entitlement, or account credentials
# - config: operator-provided config/tokens/credentials/staged data
# - url: direct archive URL or staged artifact override
# - export: files exported/generated from an owned client install
# - service: external local service dependency
cod2server	assets	copy owned Call of Duty 2 files into <install_dir>/main/: localized_*.iwd and default_localize_mp.cfg
cod4server	assets	copy owned Call of Duty 4 files into <install_dir>/: fileSysCheck.cfg and main/localized_*.iwd
coduoserver	assets	copy owned base Call of Duty multiplayer files into <install_dir>/main/: pak0.pk3 or default_mp.cfg
aloftserver	assets	copy an owned Aloft server tree into <install_dir>/ so AloftServerNoGuiLoad.ps1 exists
ahlserver	assets	copy the full Action Half-Life mod tree into <install_dir>/action/ so maps/ahl_hydro.bsp exists
alienarenaserver	assets	stage a native Alien Arena dedicated server tree containing crx-dedicated in <install_dir> before setup/start
bf1942server	url	set url to a working Battlefield 1942 dedicated-server archive or stage bf1942_lnxded in <install_dir> before setup/start
bbserver	assets	copy the full BrainBread mod tree into <install_dir>/brainbread/ so maps/bb_chp4_slaywatch.bsp exists
bfvserver	url	set url to a working Battlefield Vietnam dedicated-server archive or stage bfvietnam_lnxded in <install_dir> before setup/start
dstserver	config	provide cluster_token.txt plus cluster.ini and <shard>/server.ini under <install_dir>/<confdir>/<cluster>/
etlegacyserver	assets	copy owned Wolfenstein: Enemy Territory base data into <install_dir>/etmain/: pak0.pk3
ets2server	export	stage exported ETS2 server packages/settings from an owned client install before start
atsserver	export	stage exported ATS server packages/settings from an owned client install before start
foundryserver	assets	stage a native FOUNDRY dedicated server tree containing FoundryDedicatedServer in <install_dir> before setup/start
gravserver	assets	copy an owned GRAV dedicated server tree into <install_dir>/ so CAGGameServer-Win32-Shipping exists
hogwarpserver	url	set url to a direct HogWarp server archive or stage HogWarpServer.exe in <install_dir> before setup/start
identityserver	url	set url to a direct Identity server archive or stage IdentityServer.x86_64 in <install_dir> before setup/start
jk2server	url	set url to a working Jedi Outcast dedicated-server archive or stage jk2mvded.x86_64 in <install_dir> before setup/start
minecraft.custom	url	place a real server jar at <install_dir>/<exe_name> and rerun setup
minecraft.tekkit	url	set url to a direct Tekkit server archive URL or stage Tekkit.jar in <install_dir>/ before setup/start
mxbikesserver	url	set url to a real MX Bikes dedicated-server archive before setup
nsserver	assets	copy the full Natural Selection mod tree into <install_dir>/ns/ so maps/ns_hera.bsp exists
q3server	assets	copy owned Quake III Arena base data into <install_dir>/baseq3/: pak0.pk3
q4server	url	set url to a working Quake 4 dedicated-server archive or stage q4ded.x86 in <install_dir> before setup/start
qlserver	auth	use an owned/authenticated Quake Live entitlement plus any required server auth/config
rtcwserver	assets	copy owned RTCW multiplayer pk3 assets into <install_dir>/main/
mohaaserver	assets	copy an owned MOHAA dedicated server tree into <install_dir>/ so mohaa_lnxded exists
sampserver	url	set url to a working SA-MP dedicated-server archive or stage samp03svr in <install_dir> before setup/start
skyrimtogetherrebornserver	url	set url to a working Skyrim Together Reborn server archive or stage SkyrimTogetherServer in <install_dir> before setup/start
sfcserver	assets	stage the full SourceForts Classic tree in <install_dir>/sfclassic/ and provide the owned HL2DM/SDK 2013 Multiplayer content it expects
starbound	assets	stage a native Starbound server tree containing linux64/starbound_server in <install_dir> before setup/start
sof2server	assets	copy an owned SOF2 dedicated server tree into <install_dir>/ so sof2ded exists
stormworksserver	auth	use authenticated Steam or SteamCMD access to install the Stormworks Dedicated Server tool, then stage that installed server tree into <install_dir>
subnauticaserver	assets	provide a real Subnautica installation path for Nitrox (for example SUBNAUTICA_INSTALLATION_PATH)
tsserver	assets	copy the full The Specialists mod tree into <install_dir>/ts/ so maps/ts_neobaroque.bsp exists
ut3server	assets	copy an owned UT3 dedicated server tree into <install_dir>/ so Binaries/ut3 exists; set OpenSpy credentials if you want authenticated advertising
vsserver	assets	copy the full Vampire Slayer mod tree into <install_dir>/vs/ so maps/vs_frost.bsp exists
lifeisfeudalserver	service	provide a local MySQL/MariaDB service reachable on localhost before start
zmrserver	assets	copy the full Zombie Master: Reborn content tree into <install_dir>/zombie_master_reborn/ so maps/zm_docksofthedead.bsp exists
