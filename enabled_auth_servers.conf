# Enabled authenticated/provider-backed game server modules
#
# Each non-empty, non-comment line marks a game module as supported in
# ENABLED (AUTH) mode.
#
# Format:  module_name	category	reason
# (tab-separated)
#
# These modules count as enabled/supported, but still require provider-managed
# authentication, tokens, licenses, or provisioning before setup/start can
# fully succeed.
#
# Supported categories:
# - provider-auth: provider-managed credentials such as EOS client ID/secret
# - provider-token: provider-managed host/install token
# - provider-license: provider-issued license key or entitlement credential
# - provider-provisioning: provider-backed provisioning flow such as txAdmin
# - mixed: auth-backed prerequisite that does not fit one category yet
tiserver	provider-auth	set eos_client_id and eos_client_secret for Epic Online Services dedicated-server authentication before start
pathoftitansserver	provider-token	set auth_token to an Alderon host account token for AlderonGamesCmd installs, or stage a direct archive override before setup/start
gtafivemserver	provider-provisioning	complete txAdmin/server-data provisioning with server.cfg and a Cfx license key before lifecycle validation
redmserver	provider-provisioning	complete txAdmin/server-data provisioning with server.cfg and a Cfx license key before lifecycle validation
battlebitserver	provider-provisioning	set apiendpoint to the BattleBit community server API host:port, optionally set apitoken, and ensure the host is approved for BattleBit community-server hosting before start
