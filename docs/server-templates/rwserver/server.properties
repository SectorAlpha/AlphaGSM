# Rising World server.properties template
# Place this file at: <install_dir>/server.properties

# Server settings
Server_Port=4255

# Server identity
Server_Name=AlphaGSM Rising World Server
World_Name=world

# Notes
# AlphaGSM launches the native Linux binary directly and syncs:
#   servername = AlphaGSM <server name>
#   world = <server name>
#   port = 4255 (query/info TCP is on port-1)
